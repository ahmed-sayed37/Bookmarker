<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Amatic+SC:wght@400;700&family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pacifico&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./bootstrap/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./bootstrap/bootstrap.min.css">
</head>

<body>

  <section class="interface ">
    <div class="container d-flex flex-column justify-content-center align-items-center">
      <h1 class="text-center mt-5 fw-bold py-3">Bookmarker</h1>

      <div class="bookmark d-flex flex-column justify-content-center align-items-center gap-3 w-100 pt-3 py-5 mt-3">
        <h2 class="text-center title position-relative fw-bold pb-3">
          <i class="ps-1 fa-solid fa-bookmark" style="color: #00802b;"></i>
          Bookmark your favorite sites
          <i class="pe-1 fa-solid fa-bookmark" style="color: #00802b;"></i>
        </h2>


        <div class="mb-3 w-100">
          <label for="bookmarkName" class="form-label fw-bold"> <i class="fa-solid fa-book-bookmark pe-2"></i>Site
            Name</label>
          <input type="text" class="form-control" id="bookmarkName" placeholder="Bookmark Name">
        </div>

        <div class="mb-3 w-100 ">
          <label for="bookmarkURL" class="form-label fw-bold"><i class="fa-solid fa-link pe-2"></i> Website URL</label>
          <input type="text" class="form-control" id="bookmarkURL" placeholder="Website URL">
        </div>


        <div class="bookmark2 d-flex flex-column justify-content-center align-items-center gap-3 w-100 p-3 py-5 mt-3">
          <button id="addBtn" class="btn btn-danger">Submit</button>
        </div>

        <div id="errorMsg" class="alert alert-danger mt-3" style="display: none;" role="alert">
          <i class="fas fa-exclamation-circle me-2"></i>
          <span></span>
        </div>

        <table class="table table-striped table-bordered mt-4">
          <thead>
            <tr>
              <th class="text-center">Index</th>
              <th class="text-center">Website Name</th>
              <th class="text-center">Visit</th>
              <th class="text-center">Delete</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>




      </div>
    </div>

  </section>
  <script src="./js/main.js"></script>
</body>

</html>
